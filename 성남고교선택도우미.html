<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성남시 고교 선택 도우미 - 진로/학과별 교육과정 매칭</title>
<style>
:root{
  --navy:#1f3a5f; --navy-d:#16293f; --paper:#faf8f3; --card:#ffffff;
  --ink:#242018; --ink-2:#5c584d; --line:#e4ddd0;
  --ok:#2f7d4f; --ok-bg:#e5f3ea; --warn:#a5760f; --warn-bg:#faf0d9;
  --bad:#b23a3a; --bad-bg:#fbe9e9; --na:#8a857a; --na-bg:#f1efe9;
  --accent:#c65d2e;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.5;
}
.wrap{max-width:960px; margin:0 auto; padding:0 16px 60px;}
header.top{
  background:var(--navy); color:#fff; padding:22px 16px 20px;
  margin-bottom:0;
}
header.top h1{margin:0 0 4px; font-size:19px; font-weight:700; letter-spacing:-0.2px;}
header.top p{margin:0; font-size:12.5px; color:#c7d3e0;}
.searchbar{
  background:var(--navy-d); padding:14px 16px 18px;
}
.searchbar .inner{max-width:960px; margin:0 auto; display:flex; gap:8px; flex-wrap:wrap;}
.searchbar input[type=text]{
  flex:1 1 260px; padding:11px 14px; border-radius:8px; border:none;
  font-size:15px; background:#fff; color:var(--ink);
}
.searchbar select{
  padding:11px 10px; border-radius:8px; border:none; font-size:14px;
  background:#fff; color:var(--ink);
}
.chiprow{max-width:960px; margin:10px auto 0; padding:0 16px; display:flex; flex-direction:column; gap:7px;}
.chipgroup{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.chipgroup .glabel{font-size:11px; color:#9fb0c4; min-width:64px; flex-shrink:0;}
.chip{
  font-size:12px; padding:5px 11px; border-radius:999px; cursor:pointer; user-select:none;
  border:1px solid transparent; color:#fff;
}
.chip.g-med{background:#5b2f36; border-color:#7a3f47;}
.chip.g-med:hover, .chip.g-med.active{background:#a5424f; border-color:#a5424f;}
.chip.g-tech{background:#274a63; border-color:#345c7a;}
.chip.g-tech:hover, .chip.g-tech.active{background:#2f7bb0; border-color:#2f7bb0;}
.chip.g-hum{background:#2c4a3c; border-color:#3a604e;}
.chip.g-hum:hover, .chip.g-hum.active{background:#3f8a67; border-color:#3f8a67;}
.chip.g-free{background:#4a3a5e; border-color:#5c4a73;}
.chip.g-free:hover, .chip.g-free.active{background:#7a5ba3; border-color:#7a5ba3;}
.customhint{
  max-width:960px; margin:8px auto 0; padding:0 16px; font-size:12px; color:#a9bcd0;
}

.stats{
  padding:12px 16px 0; font-size:12.5px; color:var(--ink-2);
}
.results{padding:10px 0 0;}
.dept-card{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:14px 16px; margin-bottom:9px; cursor:pointer; transition:border-color .12s;
}
.dept-card:hover{border-color:#c9bfa8;}
.dept-card .row1{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.dept-card .univ{font-weight:700; font-size:15px;}
.dept-card .region{font-size:11.5px; color:var(--ink-2); white-space:nowrap;}
.dept-card .dept{font-size:14px; color:var(--ink); margin-top:2px;}
.dept-card .group{font-size:12px; color:var(--ink-2);}
.dept-card .summary{margin-top:8px; font-size:12px; color:var(--ink-2); display:flex; gap:10px; flex-wrap:wrap;}
.dept-card .summary b{color:var(--ok); font-weight:700;}

.empty{padding:40px 20px; text-align:center; color:var(--ink-2); font-size:14px;}

/* detail overlay */
.overlay{
  position:fixed; inset:0; background:rgba(30,25,15,0.45); z-index:50;
  display:none; align-items:flex-start; justify-content:center; padding:26px 12px;
  overflow-y:auto;
}
.overlay.show{display:flex;}
.panel{
  background:var(--paper); border-radius:12px; max-width:640px; width:100%;
  padding:22px 20px 26px; position:relative; box-shadow:0 10px 40px rgba(0,0,0,0.25);
}
.panel .close{
  position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%;
  background:var(--line); border:none; font-size:16px; cursor:pointer; color:var(--ink);
}
.panel h2{margin:0 0 2px; font-size:18px;}
.panel .sub{font-size:13px; color:var(--ink-2); margin-bottom:14px;}
.panel .subjblock{background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:13px;}
.panel .subjblock .lbl{font-size:11px; color:var(--ink-2); text-transform:uppercase; letter-spacing:.03em; margin-bottom:3px;}
.legend{display:flex; gap:12px; margin:14px 0 8px; font-size:11.5px; color:var(--ink-2); flex-wrap:wrap;}
.legend span{display:inline-flex; align-items:center; gap:4px;}
.dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
.school-list{display:flex; flex-direction:column; gap:6px; margin-top:8px;}
.school-row{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px;
  border:1px solid var(--line); background:#fff;
}
.school-row .badge{
  font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:5px; white-space:nowrap;
}
.school-row{flex-wrap:wrap;}
.badge-O{background:var(--ok-bg); color:var(--ok);}
.badge-T{background:var(--warn-bg); color:var(--warn);}
.badge-X{background:var(--bad-bg); color:var(--bad);}
.badge-N{background:var(--na-bg); color:var(--na);}
.school-row .sname{font-weight:600; font-size:13.5px; flex:1;}
.school-row .missing{font-size:11.5px; color:var(--bad); max-width:230px; text-align:right;}
.note{
  margin-top:16px; font-size:11.5px; color:var(--ink-2); background:#fff;
  border:1px solid var(--line); border-radius:8px; padding:10px 12px;
}
@media (max-width:520px){
  .school-row .missing{display:none;}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1>성남시 고교 선택 도우미</h1>
    <p>희망 진로·학과를 검색하면, 그 학과 지원에 필요한 과목을 개설하는 성남 분당구 일반고를 보여줍니다</p>
  </div>
</header>

<div class="searchbar">
  <div class="inner">
    <input type="text" id="q" autocomplete="off" placeholder="학과명 또는 대학명 검색 (예: 컴퓨터공학, 간호, 경희대)">
    <select id="region">
      <option value="">전체 권역</option>
    </select>
  </div>
  <div class="chiprow" id="quickchips"></div>
  <div class="customhint">목록에 없는 학과라도 검색창에 직접 입력하면 바로 찾을 수 있습니다 (예: 산림학과, 도시공학과 등)</div>
</div>

<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="results" id="results"></div>
  <div style="margin-top:28px; padding-top:14px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-2); text-align:center;">
    제작: 샛별중 진로진학상담교사 양예주
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel"></div>

"core":[],"rec":[],"coreRaw":"수학, 영어, 사회","recRaw":""},{"u":"전남대 (여수)","d":"스마트응용설계학과","g":"조기취업형계약학과","rg":"호남권","rn":"전남","core":["물리학"],"rec":[],"coreRaw":"수학, 물리학","recRaw":""},{"u":"전남대 (여수)","d":"스마트ICT융합공학과","g":"조기취업형계약학과","rg":"호남권","rn":"전남","core":["물리학"],"rec":[],"coreRaw":"수학, 물리학","recRaw":""},{"u":"전남대 (여수)","d":"스마트전기제어공학과","g":"조기취업형계약학과","rg":"호남권","rn":"전남","core":["물리학"],"rec":[],"coreRaw":"수학, 물리학","recRaw":""},{"u":"전남대 (여수)","d":"디지털융합정보학과","g":"조기취업형계약학과","rg":"호남권","rn":"전남","core":["물리학"],"rec":[],"coreRaw":"수학, 물리학","recRaw":""}],"categories":{"lang":["관광일본어","관광중국어","독일어","독일어회화","생활과한자","심화일본어","심화중국어","언어생활과한자","일본문화","일본어","일본어회화","일본언어와역사의이해","일본언어와역사의이해1","일본언어와역사의이해2","전공기초스페인어","중국문화","중국어","중국어회화","중국언어와역사의이해","중국언어와역사의이해1","중국언어와역사의이해2","한문","한문고전읽기"]}};</script>
<script>(function(){
  var DATA = window.APP_DATA;
  var schools = DATA.schools;
  var canon = DATA.canon;
  var depts = DATA.depts;
  var schoolNames = Object.keys(schools);

  var regions = Array.from(new Set(depts.map(function(d){return d.rg;}))).filter(Boolean);
  var regionSel = document.getElementById('region');
  regions.forEach(function(r){
    var o = document.createElement('option');
    o.value = r; o.textContent = r;
    regionSel.appendChild(o);
  });

  var quickGroups = [
    {label:'의약·보건', cls:'g-med', terms:['의예과','치의예과','한의예과','약학과','수의예과','간호학과']},
    {label:'자연·첨단공학', cls:'g-tech', terms:['반도체공학과','인공지능학과','컴퓨터공학과','전기전자공학','생명공학과','화학공학과','기계공학과','신소재공학과','항공우주공학과']},
    {label:'인문·사회', cls:'g-hum', terms:['경영학과','경제학과','통계학과','행정학과','정치외교학과','철학과','심리학과']},
    {label:'무전공·융합', cls:'g-free', terms:['자유전공학부']}
  ];
  var chipRow = document.getElementById('quickchips');
  var allChips = [];
  quickGroups.forEach(function(g){
    var row = document.createElement('div');
    row.className = 'chipgroup';
    var lab = document.createElement('span');
    lab.className = 'glabel';
    lab.textContent = g.label;
    row.appendChild(lab);
    g.terms.forEach(function(t){
      var c = document.createElement('span');
      c.className = 'chip ' + g.cls;
      c.textContent = t;
      c.onclick = function(){
        var q = document.getElementById('q');
        if (c.classList.contains('active')) {
          c.classList.remove('active');
          q.value = '';
        } else {
          allChips.forEach(function(x){x.classList.remove('active');});
          c.classList.add('active');
          q.value = t;
        }
        render();
      };
      allChips.push(c);
      row.appendChild(c);
    });
    chipRow.appendChild(row);
  });

  var categories = DATA.categories || {};

  function keySatisfied(key, schoolKeySet){
    if (key.indexOf('OR:') === 0) {
      var catKeys = categories[key.slice(3)] || [];
      return catKeys.some(function(ck){ return schoolKeySet.indexOf(ck) !== -1; });
    }
    return schoolKeySet.indexOf(key) !== -1;
  }

  function statusFor(coreKeys, schoolKeySet){
    if (!coreKeys || coreKeys.length === 0) return 'N';
    var have = coreKeys.filter(function(k){ return keySatisfied(k, schoolKeySet); });
    if (have.length === coreKeys.length) return 'O';
    if (have.length === 0) return 'X';
    return 'T'; // triangle / partial
  }

  function missingSubjects(coreKeys, schoolKeySet){
    return coreKeys.filter(function(k){ return !keySatisfied(k, schoolKeySet); })
      .map(function(k){return canon[k] || k;});
  }

  function displayList(keys){
    if (!keys || keys.length === 0) return '';
    return keys.map(function(k){return canon[k] || k;}).join(', ');
  }

  function ratioFor(keys, schoolKeySet){
    if (!keys || keys.length === 0) return null;
    var have = keys.filter(function(k){ return keySatisfied(k, schoolKeySet); });
    return have.length + '/' + keys.length;
  }

  function scoreDept(d){
    var oCount = 0;
    schoolNames.forEach(function(s){
      if (statusFor(d.core, schools[s]) === 'O') oCount++;
    });
    return oCount;
  }

  var resultsEl = document.getElementById('results');
  var statsEl = document.getElementById('stats');

  var SYNONYMS = {
    '전기전자공학': ['전기전자','전기정보','전자전기','정보전자'],
    '컴퓨터공학': ['컴퓨터공학','컴퓨터소프트웨어','컴퓨터정보','전산','소프트웨어'],
    '인공지능': ['인공지능','에이아이','ai'],
    '경영학': ['경영학','경영'],
    '정치외교학': ['정치외교','정치국제','정치'],
  };

  function fieldNorm(s){
    return String(s||'').toLowerCase()
      .replace(/[·・\/\s]/g, '')
      .replace(/(학과|학부|학전공|전공)$/g, '');
  }

  function matchQuery(d, q){
    if (!q) return true;
    var qn = fieldNorm(q);
    var candidates = [qn];
    Object.keys(SYNONYMS).forEach(function(key){
      var kn = fieldNorm(key);
      if (qn === kn || qn.indexOf(kn) !== -1 || kn.indexOf(qn) !== -1) {
        SYNONYMS[key].forEach(function(alt){ candidates.push(fieldNorm(alt)); });
      }
    });
    var hay = fieldNorm(d.u) + ' ' + fieldNorm(d.d) + ' ' + fieldNorm(d.g);
    return candidates.some(function(c){ return c && hay.indexOf(c) !== -1; });
  }

  function render(){
    var q = document.getElementById('q').value.trim();
    var region = regionSel.value;
    var filtered = depts.filter(function(d){
      if (region && d.rg !== region) return false;
      return matchQuery(d, q);
    });

    if (!q && !region) {
      resultsEl.innerHTML = '';
      statsEl.textContent = '학과명이나 대학명을 입력하거나, 위 버튼을 눌러 검색을 시작하세요.';
      return;
    }

    filtered.sort(function(a,b){ return scoreDept(b) - scoreDept(a); });
    var shown = filtered.slice(0, 80);

    statsEl.textContent = filtered.length + '개 모집단위 검색됨' + (filtered.length > 80 ? ' (상위 80개 표시, 검색어를 구체화해 보세요)' : '');

    resultsEl.innerHTML = '';
    if (shown.length === 0) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = '일치하는 결과가 없습니다. 다른 검색어를 입력해보세요.';
      resultsEl.appendChild(e);
      return;
    }

    shown.forEach(function(d, idx){
      var oCount = scoreDept(d);
      var card = document.createElement('div');
      card.className = 'dept-card';
      card.innerHTML =
        '<div class="row1"><span class="univ">' + esc(d.u) + '</span>' +
        '<span class="region">' + esc(d.rg) + ' · ' + esc(d.rn) + '</span></div>' +
        '<div class="dept">' + esc(d.d || d.g) + '</div>' +
        (d.d ? '<div class="group">' + esc(d.g) + '</div>' : '') +
        '<div class="summary">' +
          (d.core && d.core.length ? '핵심과목: ' + esc(displayList(d.core)) : '핵심과목 특정 없음 (진로·적성에 따라 자유 선택)') +
          (d.core && d.core.length ? ' &nbsp;·&nbsp; <b>' + oCount + '/' + schoolNames.length + '개교 충족</b>' : '') +
        '</div>';
      card.onclick = function(){ openDetail(d); };
      resultsEl.appendChild(card);
    });
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  var overlay = document.getElementById('overlay');
  var panel = document.getElementById('panel');

  function openDetail(d){
    var rows = schoolNames.map(function(s){
      var coreSt = statusFor(d.core, schools[s]);
      var recSt = statusFor(d.rec, schools[s]);
      return {
        s:s, coreSt:coreSt, recSt:recSt,
        coreMissing: coreSt==='T'||coreSt==='X' ? missingSubjects(d.core, schools[s]) : [],
        recMissing: recSt==='T'||recSt==='X' ? missingSubjects(d.rec, schools[s]) : [],
        recRatio: ratioFor(d.rec, schools[s])
      };
    });
    var order = {O:0, T:1, N:2, X:3};
    rows.sort(function(a,b){
      return (order[a.coreSt]-order[b.coreSt]) || (order[a.recSt]-order[b.recSt]) || a.s.localeCompare(b.s,'ko');
    });

    var badgeLabel = {O:'O', T:'△', X:'X', N:'-'};

    var html = '';
    html += '<button class="close" aria-label="닫기">&times;</button>';
    html += '<h2>' + esc(d.u) + '</h2>';
    html += '<div class="sub">' + esc(d.g) + (d.d ? ' · ' + esc(d.d) : '') + ' &nbsp;|&nbsp; ' + esc(d.rg) + ' ' + esc(d.rn) + '</div>';

    if (d.core && d.core.length) {
      html += '<div class="subjblock"><div class="lbl">핵심과목 (추출)</div>' + esc(displayList(d.core)) + '</div>';
    } else {
      html += '<div class="subjblock"><div class="lbl">핵심과목</div>' + esc(d.coreRaw || '계열 구분 없이 진로·적성에 따라 자유 선택') + '</div>';
    }
    if (d.rec && d.rec.length) {
      html += '<div class="subjblock"><div class="lbl">권장과목 (추출)</div>' + esc(displayList(d.rec)) + '</div>';
    } else {
      html += '<div class="subjblock"><div class="lbl">권장과목</div>' + esc(d.recRaw || '별도 권장과목 없음') + '</div>';
    }

    html += '<div class="legend">' +
      '<span><span class="dot" style="background:#2f7d4f"></span>O 전부 개설</span>' +
      '<span><span class="dot" style="background:#a5760f"></span>△ 일부만 개설</span>' +
      '<span><span class="dot" style="background:#b23a3a"></span>X 개설 안 함</span>' +
      '<span><span class="dot" style="background:#8a857a"></span>- 특정과목 없음</span>' +
    '</div>';
    html += '<div style="font-size:11px;color:var(--ink-2);margin-bottom:6px;">각 학교 줄의 왼쪽 배지 = 핵심과목 충족, 오른쪽 배지 = 권장과목 충족</div>';

    html += '<div class="school-list">';
    rows.forEach(function(r){
      var missingTxt = [];
      if (r.coreMissing.length) missingTxt.push('핵심 미개설: ' + r.coreMissing.join(', '));
      if (r.recMissing.length) missingTxt.push('권장 미개설: ' + r.recMissing.join(', '));
      html += '<div class="school-row">' +
        '<span class="badge badge-' + r.coreSt + '" title="핵심과목">핵심 ' + badgeLabel[r.coreSt] + '</span>' +
        '<span class="badge badge-' + r.recSt + '" title="권장과목">권장 ' + badgeLabel[r.recSt] + (r.recRatio ? ' ('+r.recRatio+')' : '') + '</span>' +
        '<span class="sname">' + esc(r.s) + '</span>' +
        (missingTxt.length ? '<span class="missing">' + esc(missingTxt.join(' / ')) + '</span>' : '') +
      '</div>';
    });
    html += '</div>';

    html += '<div class="note">' +
      '"제2외국어/한문" 요구는 그 계열 과목 중 1개만 개설되어도 충족으로 처리합니다. ' +
      '그 외 "[A,B,C,D 중 3과목]" 같은 택N 조건은 A~D를 전부 요구하는 것으로 보수적으로 처리되어 실제보다 엄격하게 판정될 수 있습니다. ' +
      '개설과목은 편제표 기준이며 실제 폐강 여부는 학교알리미로 별도 확인이 필요합니다.' +
    '</div>';

    panel.innerHTML = html;
    panel.querySelector('.close').onclick = closeDetail;
    overlay.classList.add('show');
  }

  function closeDetail(){
    overlay.classList.remove('show');
  }
  overlay.addEventListener('click', function(e){
    if (e.target === overlay) closeDetail();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeDetail();
  });

  var qInput = document.getElementById('q');
  qInput.addEventListener('input', function(){
    allChips.forEach(function(x){x.classList.remove('active');});
    render();
  });
  regionSel.addEventListener('change', render);

  render();
})();
</script>

</body>
</html>
